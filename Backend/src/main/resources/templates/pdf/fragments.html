<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <style th:fragment="styles">
      @page {
        size: A4;
        margin: 22mm 18mm 20mm 18mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 10pt;
        color: #1e293b;
        margin: 0;
        padding: 0;
      }

      .doc-header {
        display: table;
        width: 100%;
        margin-bottom: 10mm;
      }

      .doc-header__brand,
      .doc-header__meta {
        display: table-cell;
        vertical-align: top;
      }

      .doc-header__meta {
        text-align: right;
      }

      .brand-mark {
        display: inline-block;
        width: 34px;
        height: 34px;
        line-height: 34px;
        text-align: center;
        border-radius: 6px;
        background-color: #4f46e5;
        color: #ffffff;
        font-size: 15pt;
        font-weight: bold;
        margin-right: 8px;
      }

      .brand-row {
        display: table;
        margin-bottom: 4px;
      }

      .brand-row__mark,
      .brand-row__name {
        display: table-cell;
        vertical-align: middle;
      }

      .company-name {
        font-size: 14pt;
        font-weight: bold;
        color: #1e293b;
      }

      .company-meta {
        font-size: 8.5pt;
        color: #64748b;
        line-height: 1.5;
      }

      .doc-title {
        font-size: 20pt;
        font-weight: bold;
        color: #4f46e5;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      .doc-meta-line {
        font-size: 9pt;
        color: #475569;
        line-height: 1.6;
      }

      .doc-meta-line strong {
        color: #1e293b;
      }

      .accent-rule {
        height: 3px;
        background-color: #4f46e5;
        margin-bottom: 8mm;
      }

      .party-block {
        display: table;
        width: 100%;
        margin-bottom: 8mm;
      }

      .party-block__client,
      .party-block__status {
        display: table-cell;
        vertical-align: top;
        width: 50%;
      }

      .party-block__status {
        text-align: right;
      }

      .eyebrow {
        font-size: 7.5pt;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 3px;
      }

      .client-name {
        font-size: 11pt;
        font-weight: bold;
        color: #1e293b;
      }

      .client-meta {
        font-size: 9pt;
        color: #475569;
        line-height: 1.5;
      }

      .status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 8pt;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .status-DRAFT {
        background-color: #f1f5f9;
        color: #64748b;
      }
      .status-SENT {
        background-color: #dbeafe;
        color: #1d4ed8;
      }
      .status-PAID,
      .status-COMPLETED,
      .status-ACCEPTED {
        background-color: #dcfce7;
        color: #15803d;
      }
      .status-PARTIALLY_PAID {
        background-color: #fef3c7;
        color: #b45309;
      }
      .status-OVERDUE,
      .status-REJECTED,
      .status-FAILED {
        background-color: #fee2e2;
        color: #b91c1c;
      }
      .status-CANCELLED,
      .status-EXPIRED {
        background-color: #f1f5f9;
        color: #94a3b8;
      }
      .status-CONVERTED,
      .status-PENDING {
        background-color: #ede9fe;
        color: #6d28d9;
      }
      .status-REFUNDED {
        background-color: #ffedd5;
        color: #c2410c;
      }

      table.lines {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 6mm;
      }

      table.lines thead th {
        background-color: #f8fafc;
        color: #64748b;
        font-size: 7.5pt;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1.5px solid #e2e8f0;
      }

      table.lines thead th.num {
        text-align: right;
      }

      table.lines tbody td {
        padding: 7px 8px;
        font-size: 9.5pt;
        border-bottom: 0.5px solid #eef2f6;
        vertical-align: top;
      }

      table.lines tbody td.num {
        text-align: right;
      }

      .totals {
        display: table;
        width: 100%;
      }

      .totals__spacer {
        display: table-cell;
        width: 55%;
      }

      .totals__figures {
        display: table-cell;
        width: 45%;
      }

      .totals-row {
        display: table;
        width: 100%;
        padding: 3px 0;
      }

      .totals-row__label,
      .totals-row__value {
        display: table-cell;
        font-size: 9.5pt;
        color: #475569;
        padding: 3px 0;
      }

      .totals-row__value {
        text-align: right;
      }

      .totals-row--grand {
        margin-top: 4px;
        padding-top: 8px;
        border-top: 1.5px solid #1e293b;
      }

      .totals-row--grand .totals-row__label,
      .totals-row--grand .totals-row__value {
        font-size: 12pt;
        font-weight: bold;
        color: #1e293b;
      }

      .notes-block {
        margin-top: 8mm;
        padding: 8px 10px;
        background-color: #f8fafc;
        border-left: 3px solid #4f46e5;
        font-size: 8.5pt;
        color: #475569;
      }

      .doc-footer {
        margin-top: 14mm;
        padding-top: 6px;
        border-top: 0.5px solid #e2e8f0;
        font-size: 7.5pt;
        color: #94a3b8;
        text-align: center;
      }

      .receipt-amount {
        text-align: center;
        padding: 10mm 0;
        margin-bottom: 8mm;
        background-color: #f8fafc;
        border-radius: 6px;
      }

      .receipt-amount__label {
        font-size: 8pt;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 4px;
      }

      .receipt-amount__value {
        font-size: 26pt;
        font-weight: bold;
        color: #4f46e5;
      }

      .receipt-details {
        display: table;
        width: 100%;
      }

      .receipt-details-row {
        display: table-row;
      }

      .receipt-details-row__label,
      .receipt-details-row__value {
        display: table-cell;
        padding: 5px 0;
        font-size: 9.5pt;
        border-bottom: 0.5px solid #eef2f6;
      }

      .receipt-details-row__label {
        color: #94a3b8;
        width: 45%;
      }

      .receipt-details-row__value {
        color: #1e293b;
        font-weight: bold;
        text-align: right;
      }
    </style>
  </head>
  <body></body>
</html>
