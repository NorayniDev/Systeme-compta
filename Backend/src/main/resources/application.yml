spring:
  application:
    name: facturation-pme-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/facturationpme}
    username: ${DB_USERNAME:facturationpme}
    password: ${DB_PASSWORD:facturationpme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-this-default-is-for-local-dev-only}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  payment:
    wave:
      # Portail developpeur : https://www.wave.com/fr/business/ -> docs.wave.com/business
      base-url: ${WAVE_BASE_URL:https://api.wave.com}
      api-key: ${WAVE_API_KEY:}
      webhook-secret: ${WAVE_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
