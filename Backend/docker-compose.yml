services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facturationpme
      POSTGRES_USER: facturationpme
      POSTGRES_PASSWORD: facturationpme
    ports:
      - "5432:5432"
    volumes:
      - facturationpme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturationpme"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/facturationpme
      DB_USERNAME: facturationpme
      DB_PASSWORD: facturationpme
      JWT_SECRET: local-dev-secret-do-not-use-in-production-please-change-me-32bytes-min
      # Motif joker (dev uniquement) : `ng serve` choisit un port aleatoire des que 4200 est deja
      # occupe (ex: http://localhost:59845) - eviter de devoir mettre a jour cette liste a chaque
      # fois. Voir SecurityConfig.corsConfigurationSource (setAllowedOriginPatterns).
      CORS_ALLOWED_ORIGINS: http://localhost:*
      # Vides par defaut : le paiement en ligne Wave reste desactive (erreur explicite) tant
      # que ces deux variables ne sont pas renseignees avec de vrais identifiants marchand.
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  facturationpme-postgres-data:
